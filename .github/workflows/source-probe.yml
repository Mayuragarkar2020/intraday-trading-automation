name: live-data-source-probe
on:
  push:
    paths:
      - scripts/probe_real_sources.py
      - .github/workflows/source-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe official source archives (no credentials)
        run: python -m scripts.probe_real_sources
