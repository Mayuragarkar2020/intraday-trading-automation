name: live-20-session-liquidity-research
on:
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run research only (no trading)
        run: python -m scripts.live_liquidity_report --dates-file config/verified_sessions_2026-09-25.txt --asof 2026-09-25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-liquidity-report
          path: output/
          if-no-files-found: warn
