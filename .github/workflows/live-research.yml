name: real-20-session-research
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/discover_sessions.py
      - scripts/live_liquidity_report.py
      - .github/workflows/live-research.yml
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Discover and verify 20 NSE archive sessions
        run: python -m scripts.discover_sessions --asof 2026-09-25
      - name: Compute real-data provisional liquidity report
        run: python -m scripts.live_liquidity_report --dates-file data/sessions.txt --asof 2026-09-25
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: research-only-liquidity-2026-09-25
          path: output/live_liquidity_report.json
          retention-days: 7
