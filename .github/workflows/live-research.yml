name: real-20-session-research
on:
  workflow_dispatch:
    inputs:
      asof:
        description: 'Completed NSE research session (YYYY-MM-DD)'
        required: true
        default: '2026-10-30'
      surveillance_date:
        description: 'NSE REG_IND report session date'
        required: true
        default: '2026-10-30'
  push:
    paths:
      - scripts/discover_sessions.py
      - scripts/check_source_readiness.py
      - src/source_readiness.py
      - src/exchange_calendar.py
      - scripts/live_liquidity_report.py
      - src/nse_price_bands.py
      - scripts/price_band_research.py
      - scripts/surveillance_research.py
      - scripts/joint_eligibility_research.py
      - scripts/fo_membership_research.py
      - src/source_dates.py
      - src/nse_surveillance.py
      - .github/workflows/live-research.yml
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESEARCH_ASOF: ${{ inputs.asof || '2026-10-30' }}
      SURVEILLANCE_DATE: ${{ inputs.surveillance_date || '2026-10-30' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Validate reviewed next NSE session
        run: python -c 'import os; from src.exchange_calendar import next_regular_session; print("Research target:",next_regular_session(os.environ["RESEARCH_ASOF"]))'
      - name: Require complete current-session NSE sources before research
        run: python -m scripts.check_source_readiness --asof "$RESEARCH_ASOF" --surveillance-date "$SURVEILLANCE_DATE" --attempts 2 --retry-delay 5
      - name: Discover and verify 20 NSE archive sessions
        run: python -m scripts.discover_sessions --asof "$RESEARCH_ASOF"
      - name: Compute real-data provisional liquidity report
        run: python -m scripts.live_liquidity_report --dates-file data/sessions.txt --asof "$RESEARCH_ASOF"
      - name: Compare average turnover thresholds
        run: python -m scripts.analyze_liquidity_sensitivity
      - name: Reconcile live Dhan detailed master (research only)
        run: python -m scripts.reconcile_live_dhan
      - name: Evaluate historical price bands (research only)
        run: python -m scripts.price_band_research --surveillance-date "$SURVEILLANCE_DATE"
      - name: Evaluate historical surveillance codes
        run: python -m scripts.surveillance_research --surveillance-date "$SURVEILLANCE_DATE"
      - name: Crosscheck historical F&O membership for No Band equities
        run: python -m scripts.fo_membership_research --asof "$RESEARCH_ASOF"
      - name: Combine historical audit diagnostics
        run: python -m scripts.joint_eligibility_research
      - name: Preserve readiness diagnostic even when blocked
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-readiness-diagnostic
          path: output/source_readiness.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: research-only-liquidity
          path: |
            output/live_liquidity_report.json
            output/liquidity_sensitivity.json
            output/dhan_reconciliation.json
            output/band_research.json
            output/surveillance_research.json
            output/joint_eligibility_research.json
            output/fo_membership_research.json
          retention-days: 7
