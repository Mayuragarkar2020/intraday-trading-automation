name: historical-fo-source-probe
on:
  push:
    paths:
      - scripts/probe_fo_membership.py
      - .github/workflows/fo-probe.yml
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m scripts.probe_fo_membership
