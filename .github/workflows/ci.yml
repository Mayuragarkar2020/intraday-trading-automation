name: test-phase-1
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: research_test
          POSTGRES_PASSWORD: research_test
          POSTGRES_DB: research_test_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research_test -d research_test_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_UNIVERSE_DATABASE_URL: postgresql://research_test:research_test@localhost:5432/research_test_store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
