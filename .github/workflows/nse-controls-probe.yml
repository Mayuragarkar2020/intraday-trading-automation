name: probe-nse-controls
on:
  push:
    paths:
      - scripts/probe_nse_controls.py
      - .github/workflows/nse-controls-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m scripts.probe_nse_controls
